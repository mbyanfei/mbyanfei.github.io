<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CT Core demo — Vanilla JavaScript</title><link rel="stylesheet" href="../style.css"/></head><body><header><div class="brand">CT CORE • TRAINING DEMO</div><h1>Corporate Treasury Portal</h1><p>Four treasury teams. Eight fictional applications. No real bank systems or internal URLs.</p></header><main><div class="notice"><b>Vanilla HTML and JavaScript</b> — change the filters and watch the app manually rebuild the card list.</div><section class="toolbar"><input id="search" class="search" aria-label="Search applications" placeholder="Search applications..."/><label><input id="favorites-only" type="checkbox"/> Favorites only</label></section><nav id="filters" class="filters" aria-label="Filter by team"></nav><p id="count" class="results" aria-live="polite"></p><section id="cards" class="grid" aria-label="Applications"></section></main><footer><a href="../">Back to React 101</a> • Fictional sample content</footer><script type="module">import {apps,teams} from '../data.js';let selectedTeam='All teams',search='',favoritesOnly=false;const favorites=new Set();function visible(){return apps.filter(a=>(selectedTeam==='All teams'||a.team===selectedTeam)&&(!favoritesOnly||favorites.has(a.id))&&`${a.name} ${a.team} ${a.desc}`.toLowerCase().includes(search.toLowerCase()));}function render(){const nav=document.querySelector('#filters');nav.replaceChildren();for(const team of teams){const b=document.createElement('button');b.className='filter'+(team===selectedTeam?' active':'');b.textContent=team;b.setAttribute('aria-pressed',String(team===selectedTeam));b.onclick=()=>{selectedTeam=team;render();};nav.append(b);}const cards=document.querySelector('#cards');cards.replaceChildren();const shown=visible();document.querySelector('#count').textContent=`${shown.length} of ${apps.length} applications`;if(!shown.length){const e=document.createElement('div');e.className='empty';e.textContent='No matching applications. Clear a filter or search.';cards.append(e);}for(const app of shown){const card=document.createElement('article');card.className='card';const top=document.createElement('div');top.className='top';const team=document.createElement('span');team.className='team';team.textContent=app.team;const star=document.createElement('button');star.className='star'+(favorites.has(app.id)?' selected':'');star.textContent=favorites.has(app.id)?'★':'☆';star.setAttribute('aria-label',`Toggle favorite for ${app.name}`);star.setAttribute('aria-pressed',String(favorites.has(app.id)));star.onclick=()=>{favorites.has(app.id)?favorites.delete(app.id):favorites.add(app.id);render();};top.append(team,star);const title=document.createElement('h2');title.textContent=app.name;const desc=document.createElement('p');desc.textContent=app.desc;const bottom=document.createElement('div');bottom.className='bottom';const tag=document.createElement('span');tag.className='tag';tag.textContent=app.tag;const preview=document.createElement('button');preview.className='preview';preview.textContent='Preview';preview.onclick=()=>alert(`${app.name} is a fictional demo application.`);bottom.append(tag,preview);card.append(top,title,desc,bottom);cards.append(card);}}document.querySelector('#search').oninput=e=>{search=e.target.value;render();};document.querySelector('#favorites-only').onchange=e=>{favoritesOnly=e.target.checked;render();};render();</script></body></html>
