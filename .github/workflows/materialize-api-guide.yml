name: Materialize API interview guide

on:
  push:
    paths:
      - '.github/workflows/materialize-api-guide.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify HTML
        shell: bash
        run: |
          cat \
            .tmp/api_interview_guide_v3.gz.b64.part0 \
            .tmp/api_interview_guide_v3.gz.b64.01_00 \
            .tmp/api_interview_guide_v3.gz.b64.01_01 \
            .tmp/api_interview_guide_v3.gz.b64.01_02 \
            .tmp/api_interview_guide_v3.gz.b64.01_03 \
            .tmp/api_interview_guide_v3.gz.b64.02_00 \
            .tmp/api_interview_guide_v3.gz.b64.02_01 \
            .tmp/api_interview_guide_v3.gz.b64.02_02 \
            .tmp/api_interview_guide_v3.gz.b64.02_03 \
            .tmp/api_interview_guide_v3.gz.b64.03_00 \
            .tmp/api_interview_guide_v3.gz.b64.03_01 \
            .tmp/api_interview_guide_v3.gz.b64.03_02 \
            .tmp/api_interview_guide_v3.gz.b64.03_03 \
            | base64 --decode | gzip --decompress > api_interview_guide_v3.html
          test "$(git hash-object api_interview_guide_v3.html)" = "d3135817b6ec59b5c8a1989d22780add2be36ef1"

      - name: Publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api_interview_guide_v3.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish Python API interview guide v3"
          git push
