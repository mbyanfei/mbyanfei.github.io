name: Clean up API interview guide staging

on:
  push:
    paths:
      - '.github/workflows/materialize-api-guide.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove staging files and workflow
        shell: bash
        run: |
          rm -rf .tmp
          rm -f .github/workflows/materialize-api-guide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Clean up API interview guide staging files"
          git push
