<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Senior AI / Agent Engineer Interview Study Guide</title>
<style>
body{margin:0;background:#f4f7fb;color:#172033;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:720px;margin:8vh auto;padding:20px}.card{background:white;border:1px solid #dbe2ec;border-radius:18px;padding:26px;box-shadow:0 10px 30px rgba(29,45,80,.08)}h1{font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:0 0 18px}.muted{color:#667085}.err{margin-top:16px;padding:12px;border-radius:10px;background:#fff2f2;color:#8c2525;display:none}button{font:inherit;border:1px solid #c9d3e5;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap"><div class="card"><h1>Loading study workspace…</h1><p class="muted">Loading the full editable interview guide.</p><p class="muted" id="status">Fetching study content…</p><div class="err" id="err"></div><button id="retry" style="display:none" onclick="location.reload()">Retry</button></div></div>
<script>
(async()=>{try{
const files=['guide.part1','guide.part2','guide.part3','guide.part4'];
const chunks=await Promise.all(files.map(async f=>{const r=await fetch(f+'?v=20260829-2',{cache:'no-store'});if(!r.ok)throw new Error('Could not fetch '+f+' ('+r.status+')');return (await r.text()).trim()}));
document.getElementById('status').textContent='Assembling guide…';
const b64=chunks.join('').replace(/\s+/g,'');
if(b64.length%4!==0)throw new Error('Study payload is incomplete.');
const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
if(!('DecompressionStream' in window))throw new Error('This browser does not support the required decompression API. Open the page in current Chrome, Edge, Safari, or Firefox.');
const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
const text=await new Response(stream).text();
if(!text.includes('Senior AI / Agent Engineer Interview Study Guide'))throw new Error('Guide integrity check failed.');
document.open();document.write(text);document.close();
}catch(e){const el=document.getElementById('err');el.style.display='block';el.textContent='Could not load the guide: '+e.message;document.getElementById('status').textContent='';document.getElementById('retry').style.display='inline-block';console.error(e)}})();
</script>
</body>
</html>
